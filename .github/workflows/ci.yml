name: CEX CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  validate-and-test:
    name: Code QA & Testing (Scan, Vet, Lint, Test)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: true

      - name: Install Dependencies
        run: go mod download

      - name: Go Formatting (fmt)
        run: if [ "$(gofmt -s -l . | wc -l)" -gt 0 ]; then exit 1; fi

      - name: Go Vet
        run: go vet ./...

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          args: --timeout=5m

      - name: Security Scan (gosec)
        uses: securego/gosec@master
        with:
          args: ./...

      - name: Run Unit Tests
        run: go test -v -cover ./...

  build-and-push:
    name: Build & Push Docker Image
    needs: validate-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/nova-cex-engine:latest
          cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/nova-cex-engine:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/nova-cex-engine:buildcache,mode=max

  deploy:
    name: Deploy to Production
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Trigger Webhook / SSH Deploy
        run: |
          echo "Image pushed successfully. Triggering deployment..."
          # Example SSH deployment:
          # eval $(ssh-agent -s)
          # echo "${{ secrets.PROD_SSH_KEY }}" | tr -d '\r' | ssh-add -
          # ssh -o StrictHostKeyChecking=no ${{ secrets.PROD_USER }}@${{ secrets.PROD_HOST }} "docker pull ${{ secrets.DOCKERHUB_USERNAME }}/nova-cex-engine:latest && docker-compose up -d --no-deps backend"
