version: '3.8'
services:
  postgres:
    image: postgres:15-alpine
    container_name: cex_postgres
    environment:
      POSTGRES_USER: cex
      POSTGRES_PASSWORD: password
      POSTGRES_DB: exchange
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./internal/db/schema.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  pgdata:
